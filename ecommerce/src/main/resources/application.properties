spring.application.name=ecommerce
server.port=8081

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerceallprocess
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.show-sql=true
# "update" agrega columnas/tablas nuevas sin borrar datos existentes
spring.jpa.hibernate.ddl-auto=update

# ================================================================
# Configuración de Email (Gmail SMTP)
# IMPORTANTE: Reemplaza con tus credenciales reales.
# En Gmail: Ajustes → Seguridad → Contraseñas de aplicaciones
# ================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=cristianbr424@gmail.com
spring.mail.password=fkxshtluvqoplyea
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# ================================================================
# Parámetros de Verificación de Email
# ================================================================
verificacion.expiracion.minutos=15
verificacion.max-intentos=5
verificacion.cooldown.segundos=60

# ================================================================
# Almacenamiento de imágenes de productos
# ================================================================
file.upload-dir=./uploads/productos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ================================================================
# Mercado Pago Sandbox
# PASOS PARA OBTENER TU TOKEN REAL:
#  1. Ir a https://www.mercadopago.com.pe/developers/panel/app
#  2. Iniciar sesión con tu cuenta de Mercado Pago
#  3. Crear una aplicación (o seleccionar una existente)
#  4. Ir a "Credenciales de prueba" (Sandbox)
#  5. Copiar el "Access token" que empieza con TEST-
#  6. Pegarlo abajo en mercadopago.access-token
#
# FORMATO CORRECTO: TEST-1234567890123456-012345-abcdef1234567890abcdef1234567890-12345678
# (NO usar el placeholder con ceros — causará error HTTP 401)
# ================================================================
mercadopago.access-token=TEST-7070316881112207-061808-c49120f7fde7761624ba0cbd51941c10-1003653674

# URLs de retorno tras el pago (back_urls del carrito MP)
mercadopago.back-url.success=http://localhost:8080/payment/success
mercadopago.back-url.failure=http://localhost:8080/payment/failure
mercadopago.back-url.pending=http://localhost:8080/payment/pending

# URL de webhook (dejar vacío para desarrollo local; usar ngrok en pruebas de webhook)
