spring.application.name=ecommerce
server.port=8081

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerceallprocess
spring.datasource.username=integrador
spring.datasource.password=integrador
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.show-sql=true

# LA REGLA DE ORO: Dile a Hibernate que NO modifique nuestra base de datos.
# Solo debe leerla y escribir datos, no alterar las tablas.
spring.jpa.hibernate.ddl-auto=none
