# Configuración para entorno Docker
server.port=8081
server.address=0.0.0.0

# Base de datos (valores desde variables de entorno, sin fallback local)
spring.datasource.url=jdbc:mysql://mysql:3306/ecommerceallprocess?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.allprocess.ecommerce=DEBUG
logging.level.org.springframework.web=INFO
